# Guard budget configuration (see guard.py). Copy to budgets.yaml and
# replace the example alias names/numbers below with your own -- alias
# names must match the `model_name` entries in config.yaml (which in
# turn mirror delegation.config.yaml's roles).
#
# daily_usd: per gateway alias, per local calendar day.
# A model without an entry falls back to "default";
# no entry and no default means no limit for that model.

warn_ratio: 0.8

daily_usd:
  default: 5.00
  lead: 10.00   # example: a higher ceiling for the coordination tier

# quota_windows: sliding-window TOKEN quotas -- separate from the $
# budgets above, for provider-side free-tier limits (e.g. requests/
# tokens per minute or per day) that are token-metered, not
# dollar-metered, and roll continuously rather than resetting at a
# calendar boundary (many providers' daily limits are a rolling 24h
# window, not a calendar day -- verify yours before relying on a
# calendar-day assumption). One or more {window_seconds, limit_tokens}
# walls per gateway alias; each is a true rolling window over
# prompt_tokens+completion_tokens in requests.db -- a request only ages
# out once it is individually older than window_seconds, never at a
# fixed clock boundary. No "default" fallback: a model absent here has
# no token wall. No cross-model fallback either way: a wall blocks the
# request, it never redirects to another model.
#
# Example below (a free-tier provider limit on the builder alias) --
# replace with your own provider's published rate limits.
quota_windows:
  builder:
    - window_seconds: 86400
      limit_tokens: 100000
    - window_seconds: 60
      limit_tokens: 12000

# quota_pools: several gateway aliases can share ONE provider key's
# physical quota ceiling (e.g. two aliases hitting the same free-tier
# key). A pool wall sums prompt_tokens+completion_tokens across ALL of
# its `aliases` in the window, same sliding-window semantics as
# quota_windows above. Checked AFTER each alias's own quota_windows
# wall (guard.py, Guard.async_pre_call_hook): a per-alias block fires
# first. Absent key = no pools configured, no-op (same "missing means
# no wall" convention as quota_windows). Uncomment and adjust aliases/
# limits to your own shared provider key:
#
# quota_pools:
#   shared_key_1:
#     aliases: [builder, lead]
#     windows:
#       - window_seconds: 86400
#         limit_tokens: 100000

# projection: closes the gap where the walls above only look at
# ALREADY-LOGGED spend, so one large request could cross a $ budget or
# a token quota mid-flight. Absent entirely (as in this file today) ==
# byte-for-byte old behavior for the $ wall; the TOKEN wall's
# projection (quota_windows/quota_pools above) always estimates the
# current request's PROMPT tokens regardless of this section
# (guard.py module docstring), but its OUTPUT side stays invisible
# (assumed 0) until assumed_max_output_tokens is set here. Uncomment
# and adjust to enable:
#
# projection:
#   # Upper bound assumed for a request's completion tokens when it
#   # has no explicit max_tokens. Either a single number (applies to
#   # every alias) or a {default, <alias>: N} map (alias overrides
#   # default) -- same convention as daily_usd above.
#   assumed_max_output_tokens:
#     default: 2048
#     builder: 1024
#   # Explicit $ prices per 1000 tokens, per alias. An alias listed
#   # here gets $-projection blocking (spent + projected_usd >=
#   # budget); an alias with a daily_usd entry but NO price here
#   # either fail-closes (below) or gets a once-per-day
#   # "no usd_prices entry" warning -- Guard never guesses a price.
#   usd_prices:
#     lead:
#       prompt_per_1k: 0.003
#       completion_per_1k: 0.015
#   # Aliases that must REFUSE a request (HTTP 429) rather than run it
#   # unprojected when no usd_prices entry exists -- for
#   # expensive/production aliases where an unprojected large request
#   # is not an acceptable risk.
#   fail_closed_aliases: []
